path: resources/raw_data/thyroid_disease/thyroid_disease.csv

label_col: class

num_cols:
  - age
  - sex
  - on_thyroxine
  - query_on_thyroxine
  - on_antithyroid_medication
  - sick
  - pregnant
  - thyroid_surgery
  - I131_treatment
  - query_hypothyroid
  - query_hyperthyroid
  - lithium
  - goitre
  - tumor
  - hypopituitary
  - psych
  - TSH
  - T3
  - TT4
  - T4U
  - FTI

cat_cols: []

train_frac: 0.4
val_frac: 0.3      # halved at random: one half grows the tree and trains the gbm, the other estimates the leaf rates and calibrates the gbm; no classifier trains on it
test_frac: 0.3     # the only split the predictors are judged against

min_class_count: 20      # classes with fewer rows are dropped: 20 leaves a few rows in every split and in each half of val
max_per_class: null      # the most train rows of a class a classifier fits on (null: all); a large class is subsampled, a small one kept whole
top_n: 32
hash_buckets: 64
