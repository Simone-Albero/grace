path: resources/raw_data/synthetic/synthetic_test.csv

label_col: label

num_cols:
  - num_1
  - num_2
  - num_3
  - num_4
  - num_5
  - num_6
  - num_7
  - num_8
  - num_9
  - num_10
  - num_11
  - num_12
  - num_13
  - num_14
  - num_15
  - num_16
  - num_17
  - num_18
  - num_19
  - num_20

cat_cols:
  - cat_1
  - cat_2

train_frac: 0.4
val_frac: 0.15     # the label budget: the ATC threshold is fitted here, and no classifier trains on it
test_frac: 0.45    # the only split the regressor and the baselines are judged against

min_class_count: 20      # classes with fewer rows are dropped: 20 leaves a few rows in every split and fold
max_per_class: 4000      # the most train rows of a class a classifier fits on (null: all); a large class is subsampled, a small one kept whole
top_n: 128
hash_buckets: 256
