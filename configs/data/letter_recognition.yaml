path: resources/raw_data/letter_recognition/letter_recognition.csv

label_col: lettr

num_cols:
  - x_box
  - y_box
  - width
  - high
  - onpix
  - x_bar
  - y_bar
  - x2bar
  - y2bar
  - xybar
  - x2ybr
  - xy2br
  - x_ege
  - xegvy
  - y_ege
  - yegvx

cat_cols: []

train_frac: 0.4
val_frac: 0.15     # the label budget: the ATC threshold is fitted here, and no classifier trains on it
test_frac: 0.45    # the only split the predictors are judged against

# All 26 classes have 734–813 instances
min_class_count: 20      # classes with fewer rows are dropped: 20 leaves a few rows in every split and fold
max_per_class: null      # the most train rows of a class a classifier fits on (null: all); a large class is subsampled, a small one kept whole
top_n: 32
hash_buckets: 64
