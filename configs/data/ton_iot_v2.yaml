path: resources/raw_data/dataset_v2/ton_iot_v2.csv

label_col: Attack

num_cols:
  - IN_BYTES
  - OUT_BYTES
  - IN_PKTS
  - OUT_PKTS
  - FLOW_DURATION_MILLISECONDS
  - DURATION_IN
  - DURATION_OUT
  - LONGEST_FLOW_PKT
  - SHORTEST_FLOW_PKT
  - MIN_IP_PKT_LEN
  - MAX_IP_PKT_LEN
  - SRC_TO_DST_SECOND_BYTES
  - DST_TO_SRC_SECOND_BYTES
  - SRC_TO_DST_AVG_THROUGHPUT
  - DST_TO_SRC_AVG_THROUGHPUT
  - RETRANSMITTED_IN_BYTES
  - RETRANSMITTED_IN_PKTS
  - RETRANSMITTED_OUT_BYTES
  - RETRANSMITTED_OUT_PKTS
  - NUM_PKTS_UP_TO_128_BYTES
  - NUM_PKTS_128_TO_256_BYTES
  - NUM_PKTS_256_TO_512_BYTES
  - NUM_PKTS_512_TO_1024_BYTES
  - NUM_PKTS_1024_TO_1514_BYTES
  - MIN_TTL
  - MAX_TTL
  - TCP_WIN_MAX_IN
  - TCP_WIN_MAX_OUT
  - DNS_TTL_ANSWER

cat_cols:
  - PROTOCOL
  - TCP_FLAGS
  - CLIENT_TCP_FLAGS
  - SERVER_TCP_FLAGS
  - ICMP_TYPE
  - ICMP_IPV4_TYPE
  - DNS_QUERY_TYPE
  - FTP_COMMAND_RET_CODE

train_frac: 0.4
val_frac: 0.3      # halved at random: one half grows the tree and trains the gbm, the other estimates the leaf rates and calibrates the gbm; no classifier trains on it
test_frac: 0.3     # the only split the predictors are judged against

min_class_count: 20      # classes with fewer rows are dropped: 20 leaves a few rows in every split and in each half of val
max_per_class: 50000      # the most train rows of a class a classifier fits on (null: all); a large class is subsampled, a small one kept whole
top_n: 128
hash_buckets: 256
