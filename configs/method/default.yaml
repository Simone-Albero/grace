# Parameters of the method, shared by every dataset (src.config.MethodConfig).
cells:                   # every class cut into compact cells of about the same size, the units every defect is measured on
  max_sample_rows: 20000 # most distinct rows of a class the method reads, a uniform sample: its Ward tree (quadratic
                         #   time) is built on them and every share is read on them, a bound of computation; every
                         #   other row is only searched as a nearest row, and joins the cell of its nearest sampled
                         #   row to be counted. The sample is the first rows of one random order of the class, so a
                         #   larger value reads the same rows and more; null reads every row (the exact method)
                         # The cells are as small as the measures allow: a node is split while both its children hold
                         #   min_rows rows, and min_rows is what tau and confidence ask for, not a key of its own
                         #   (quality.resolution_rows, the rows that decide a share tau away from tau or one half:
                         #   z^2 / (4 tau^2), 68 rows at tau 0.1 and 0.95). The regions set the granularity

quality:                 # the defects of the regions: the cells merged up their class's tree where no verdict changes
  tau: 0.1               # the one threshold, the smallest share of a region worth reporting: of its rows whose
                         #   nearest row is of a rival class (majority_overlap; minority_overlap reads one half), of its
                         #   invalid, duplicated or conflicting rows, of a rival class's rows inside its range on one
                         #   column (single_feature_cut, under it), of its class in a compact branch (low_variability)
  confidence: 0.95       # level of the Wilson interval around every share of a cell: a cell has a defect when the
                         #   share is past its threshold beyond the error of sampling, none when short of it, else
                         #   undecided
