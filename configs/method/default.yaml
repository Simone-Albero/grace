# Parameters of the method, shared by every dataset (src.config.MethodConfig).
cells:                   # every class cut into compact cells of about the same size, the units every defect is measured on
  max_fit_samples: 20000 # most distinct rows of a class its Ward tree is built on (quadratic time), a bound of
                         #   computation: every other row joins its nearest sampled row
                         # The cells are as small as the measures allow: a node is split while both its children hold
                         #   min_rows rows, and min_rows is what tau and confidence ask for, not a key of its own
                         #   (quality.resolution_rows, the rows that decide a share tau away from tau or one half:
                         #   z^2 / (4 tau^2), 68 rows at tau 0.1 and 0.95). The regions set the granularity

quality:                 # the defects of every cell against its rivals, then of the regions the cells are merged into
  tau: 0.1               # the one threshold: the share of a cell's rows whose nearest row is of a rival class (at or
                         #   over it the cell overlaps), that a one-column rule may leave on the wrong side (under it on
                         #   both sides it is a shortcut), the share of its CSV rows that may break the scenario; and,
                         #   for repetition, the share of its class a branch holds and its variance over the dataset's
  confidence: 0.95       # level of the Wilson interval around every share of a cell: a cell has a defect when the
                         #   share is past its threshold beyond the error of sampling, none when short of it, else
                         #   undecided
