# Parameters of the method, shared by every dataset (src.config.MethodConfig).
distance: euclidean      # euclidean | cosine: how the numeric columns are compared (cosine: each row's numbers at unit
                         #   length); categorical slots are added as they are, and every distance after that is euclidean

prepare:                 # the features every distance is measured on (src.prepare)
  cat_cost: 1.0          # weight of each categorical column against a numeric one, on average over pairs of rows;
                         #   the mismatch cost of a column grows as its values concentrate (2 · cat_cost / (1 - Σ p²))

cells:                   # every class cut into compact cells of about the same size, the units every defect is measured on
  max_fit_samples: 20000 # most distinct rows of a class its Ward tree is built on (weight: n_duplicates; quadratic time);
                         #   every other row joins its nearest sampled row
  max_rows: 1000         # most distinct rows of a cell, the same for every class: a defect touching tau of a cell's rows is
                         #   seen, and two cells compared are sampled alike
  min_rows: 20           # fewest distinct rows of a cell: a smaller branch of the tree joins the cells around it

quality:                 # the defects of every cell against its rivals, then of the regions the cells are merged into
  tau: 0.1               # the one threshold: the share of a cell's rows that may be confused with a rival's; at or over it
                         #   the cell overlaps, and a shortcut is a removal of columns that brings it there
  max_rows_per_cell: 500 # distinct rows of a cell its pairs are measured on: a uniform sample above this
  rival_rows: 100        # distinct rows of a cell its rivals are searched from (a budget: the search compares every row
                         #   with every other)
  max_group: 3           # most columns removed from a pair to find a shortcut
