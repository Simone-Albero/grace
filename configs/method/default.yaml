# Parameters of the method, shared by every dataset (src.config.MethodConfig).
distance: euclidean      # euclidean | cosine: how the numeric columns are compared (cosine: each row's numbers at unit
                         #   length); categorical slots are added as they are, and every distance after that is euclidean

prepare:                 # the features every distance is measured on (src.prepare)
  cat_cost: 1.0          # weight of each categorical column against a numeric one, on average over pairs of rows;
                         #   the mismatch cost of a column grows as its values concentrate (2 · cat_cost / (1 - Σ p²))

graph:                   # k-nearest-neighbour graph of the rows (src.graph)
  max_samples: 50000     # rows in the graph: a uniform sample above this (the build is quadratic)
  k: 30                  # neighbours of each row

clustering:              # regions: a weighted Ward tree per class (weight: n_duplicates), cut where the loss is least
  max_fit_samples: 20000 # distinct rows of a class the tree is built on (quadratic time); the others are voted
  max_regions: 2500      # regions over all classes, shared equally between them; past it a penalty per region
  min_cluster_floor: 20  # fewest rows of a region in the tree's sample: a smaller branch is pruned, its rows voted
  hardness_k: 30         # neighbours behind the kDN hardness the granularity loss is judged on
  vote_k: 10             # labelled neighbours whose majority gives a region to a pruned or unsampled row

complexity:              # descriptors of every region and class (src.complexity)
  top_k_clusters: 10           # nearest rivals (populations of another class) each population is compared with
  max_sample_per_region: 200   # rows a region is measured on when the rows exceed graph.max_samples
  max_sample_per_class: 2000   # the same for a class
  silhouette_max_samples: 10000  # subsample behind the silhouette tail (p5_silhouette, frac_at_risk)
  silhouette_min_per_cluster: 50 # rows per population kept even past silhouette_max_samples
