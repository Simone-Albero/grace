# Parameters of the method, shared by every dataset (src.config.MethodConfig).
distance: euclidean      # euclidean | cosine: how the numeric columns are compared (cosine: each row's numbers at unit
                         #   length); categorical slots are added as they are, and every distance after that is euclidean

prepare:                 # the features every distance is measured on (src.prepare)
  cat_cost: 1.0          # weight of each categorical column against a numeric one, on average over pairs of rows;
                         #   the mismatch cost of a column grows as its values concentrate (2 · cat_cost / (1 - Σ p²))

clustering:              # regions: a weighted Ward tree per class (weight: n_duplicates) on half A of its rows, its
                         #   splits judged on half B, cut where the two sides are separated, then the pieces sewn back
  max_fit_samples: 20000 # most distinct rows of each half (the tree takes quadratic time); the other rows are voted
  max_regions: 2500      # regions over all classes, shared equally between them; past it the pieces keep being sewn
  split_separation: 4.0  # separation two regions of a class must keep: centroids apart by this many sd of half B's
                         #   rows along the line between them, on the numbers only, less 2 standard errors
  min_cluster_floor: 20  # fewest rows of half B on each side of a split judged: a smaller branch is pruned, its rows voted
  vote_k: 10             # labelled neighbours whose majority gives a region to a pruned or unsampled row
  stability_repeats: 1   # times the regions are made again on other halves to measure each region's stability (0: none)
  overlap_separation: 1.0  # two regions of different classes overlap when their centroids lie closer than this many
                           #   standard deviations of their rows along the line between them

quality:                 # the quality report on pairs of regions of different classes (src.quality)
  max_rows_per_region: 500     # distinct rows of a region its pairs are measured on: a uniform sample above this
  k: 4                         # neighbours inside a pair behind kDN and ENN (4 as in Flood et al.'s ENN)
  candidate_separation: 2.0    # pairs measured: separation under this (full space or without shortcut_cols), plus
                               #   the pairs sharing conflicting rows and each region's nearest rival
  diversity_pairs: 1000        # pairs of rows drawn per region for its mean cosine similarity (pdd) and collapse (tc)
  highlight:                   # from where the dashboard marks a measure (the tables keep every value)
    conflict: 0.0              #   share of rows equal to a row of another class (marked when above)
    kdn: 0.1                   #   mean share of neighbours of the other region
    enn: 0.1                   #   share of rows whose neighbours are mostly of the other region
    f3: 0.95                   #   share of the pair's rows one feature alone tells apart
    l2: 0.1                    #   error of a linear boundary between the two regions
    pdd: 0.95                  #   mean cosine similarity of the rows of a region
    tc: 0.5                    #   share of pairs of rows of a region that are functionally identical (cosine > 0.95)
    dup_share: 0.5             #   share of the CSV rows of a region that are copies of another
