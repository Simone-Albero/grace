training:                # DL classifiers only
  epochs: 30
  max_grad_norm: 1.0

  dataloader:
    batch_size: 512
    shuffle: true

  early_stopping:
    patience: 5
    min_delta: 0.001
    holdout: 0.1         # share of the (balanced) train split held out to stop on, stratified by class
    dataloader:
      batch_size: 512
      shuffle: false
