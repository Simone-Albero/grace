# CSE-CIC-IDS2018 as originally released, one CSV per capture day: Thuesday-20-02 has 4 more columns
# (Flow ID, Src IP, Src Port, Dst IP), three days repeat their header inside the file (stage clean drops
# them), half of the days write decimals with 10 significant digits and half with ~15.
name: cic_2018_broken
path: resources/raw_data/cic_2018_broken/*.csv  # a glob: every day, read in sorted order
label_col: Label

num_cols:
  - Flow Duration
  - Tot Fwd Pkts
  - Tot Bwd Pkts
  - TotLen Fwd Pkts
  - TotLen Bwd Pkts
  - Fwd Pkt Len Max
  - Fwd Pkt Len Min
  - Fwd Pkt Len Mean
  - Fwd Pkt Len Std
  - Bwd Pkt Len Max
  - Bwd Pkt Len Min
  - Bwd Pkt Len Mean
  - Bwd Pkt Len Std
  - Flow Byts/s
  - Flow Pkts/s
  - Flow IAT Mean
  - Flow IAT Std
  - Flow IAT Max
  - Flow IAT Min
  - Fwd IAT Tot
  - Fwd IAT Mean
  - Fwd IAT Std
  - Fwd IAT Max
  - Fwd IAT Min
  - Bwd IAT Tot
  - Bwd IAT Mean
  - Bwd IAT Std
  - Bwd IAT Max
  - Bwd IAT Min
  - Fwd PSH Flags
  - Fwd URG Flags
  - Fwd Header Len
  - Bwd Header Len
  - Fwd Pkts/s
  - Bwd Pkts/s
  - Pkt Len Min
  - Pkt Len Max
  - Pkt Len Mean
  - Pkt Len Std
  - FIN Flag Cnt
  - SYN Flag Cnt
  - RST Flag Cnt
  - PSH Flag Cnt
  - ACK Flag Cnt
  - URG Flag Cnt
  - CWE Flag Count
  - ECE Flag Cnt
  - Down/Up Ratio
  - Init Fwd Win Byts
  - Init Bwd Win Byts
  - Fwd Act Data Pkts
  - Fwd Seg Size Min
  - Active Mean
  - Active Std
  - Active Max
  - Active Min
  - Idle Mean
  - Idle Std
  - Idle Max
  - Idle Min

cat_cols:
  - Protocol
  - Dst Port

min_class_count: 50  # classes with fewer rows are dropped
top_n: 32  # most frequent values of a categorical column with their own one-hot slot; the others share one
seed: 42
output_dir: resources/processed/cic_2018_broken
db_path: resources/processed/grace.db
