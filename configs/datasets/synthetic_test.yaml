name: synthetic_test
path: resources/raw_data/synthetic/synthetic_test.csv
label_col: label

num_cols:
  - num_1
  - num_2
  - num_3
  - num_4
  - num_5
  - num_6
  - num_7
  - num_8
  - num_9
  - num_10
  - num_11
  - num_12
  - num_13
  - num_14
  - num_15
  - num_16
  - num_17
  - num_18
  - num_19
  - num_20

cat_cols:
  - cat_1
  - cat_2

provenance:  # where each CSV row comes from: described per cell, read by the scenario; the source and time never features
  src_ip: src_ip
  src_port: src_port
  dst_ip: dst_ip
  dst_port: dst_port
  time: timestamp
  time_format: "%Y-%m-%d %H:%M:%S%.f"

scenario:  # what generate_synthetic.py says of its classes, in the clock of timestamp
  benign: class_1  # the background, bound by no rule
  background_ports: [53, 123]  # DNS and NTP: no attack class targets them
  attacks:
    class_4:  # at most 20 hosts of its own, within its hour; the planted sub-group comes from 18.99.9.9
      src_ip: [18.3.0.0, 18.3.0.1, 18.3.0.2, 18.3.0.3, 18.3.0.4, 18.3.0.5, 18.3.0.6, 18.3.0.7, 18.3.0.8, 18.3.0.9, 18.3.0.10, 18.3.0.11, 18.3.0.12, 18.3.0.13, 18.3.0.14, 18.3.0.15, 18.3.0.16, 18.3.0.17, 18.3.0.18, 18.3.0.19]
      time: [["2018-02-20 11:00:00", "2018-02-20 12:00:00"]]

min_class_count: 50  # classes with fewer rows are dropped
top_n: 32  # most frequent values of a categorical column with their own one-hot slot; the others share one
seed: 42
output_dir: resources/processed/synthetic_test
db_path: resources/processed/grace.db
