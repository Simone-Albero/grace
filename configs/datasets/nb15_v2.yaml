name: nb15_v2
path: resources/raw_data/dataset_v2/unsw_nb15_v2.csv
label_col: Attack

num_cols:
  - IN_BYTES
  - OUT_BYTES
  - IN_PKTS
  - OUT_PKTS
  - FLOW_DURATION_MILLISECONDS
  - DURATION_IN
  - DURATION_OUT
  - LONGEST_FLOW_PKT
  - SHORTEST_FLOW_PKT
  - MIN_IP_PKT_LEN
  - MAX_IP_PKT_LEN
  - SRC_TO_DST_SECOND_BYTES
  - DST_TO_SRC_SECOND_BYTES
  - SRC_TO_DST_AVG_THROUGHPUT
  - DST_TO_SRC_AVG_THROUGHPUT
  - RETRANSMITTED_IN_BYTES
  - RETRANSMITTED_IN_PKTS
  - RETRANSMITTED_OUT_BYTES
  - RETRANSMITTED_OUT_PKTS
  - NUM_PKTS_UP_TO_128_BYTES
  - NUM_PKTS_128_TO_256_BYTES
  - NUM_PKTS_256_TO_512_BYTES
  - NUM_PKTS_512_TO_1024_BYTES
  - NUM_PKTS_1024_TO_1514_BYTES
  - MIN_TTL
  - MAX_TTL
  - TCP_WIN_MAX_IN
  - TCP_WIN_MAX_OUT
  - DNS_TTL_ANSWER

cat_cols:
  - PROTOCOL
  - TCP_FLAGS
  - CLIENT_TCP_FLAGS
  - SERVER_TCP_FLAGS
  - ICMP_TYPE
  - ICMP_IPV4_TYPE
  - DNS_QUERY_TYPE
  - FTP_COMMAND_RET_CODE

split:  # stratified by class, after dropping non-finite rows and rare classes
  train: 0.4
  val: 0.15  # the ATC threshold is fitted here; no classifier trains on it
  test: 0.45  # every failure rate is measured here

min_class_count: 3000  # classes with fewer rows are dropped
top_n: 128  # most frequent values of a categorical column that keep their own code
hash_buckets: 256  # the other values are hashed into this many codes
seed: 42
output_dir: resources/processed/nb15_v2
db_path: resources/processed/grace.db
