# CSE-CIC-IDS2018, corrected release (flows extracted again, Attempted Category added), one CSV per capture day.
# Not features, as in bruno: id (the raw row id), Flow ID, Src/Dst IP, Src Port, Timestamp (Src/Dst IP and Port and
# Timestamp are read as provenance; Dst Port is a feature too, as in DataBadSmells), Attempted Category (tied to the
# label), ICMP Code/Type and the columns that repeat others (Packet Length Variance, Average Packet Size, Fwd/Bwd
# Segment Size Avg, Subflow *).
name: cic_2018
path: resources/raw_data/cic_2018/*.csv  # a glob: every day, read in sorted order
label_col: Label

num_cols:
  - Flow Duration
  - Total Fwd Packet
  - Total Bwd packets
  - Total Length of Fwd Packet
  - Total Length of Bwd Packet
  - Fwd Packet Length Max
  - Fwd Packet Length Min
  - Fwd Packet Length Mean
  - Fwd Packet Length Std
  - Bwd Packet Length Max
  - Bwd Packet Length Min
  - Bwd Packet Length Mean
  - Bwd Packet Length Std
  - Flow Bytes/s
  - Flow Packets/s
  - Flow IAT Mean
  - Flow IAT Std
  - Flow IAT Max
  - Flow IAT Min
  - Fwd IAT Total
  - Fwd IAT Mean
  - Fwd IAT Std
  - Fwd IAT Max
  - Fwd IAT Min
  - Bwd IAT Total
  - Bwd IAT Mean
  - Bwd IAT Std
  - Bwd IAT Max
  - Bwd IAT Min
  - Fwd PSH Flags
  - Bwd PSH Flags
  - Fwd URG Flags
  - Bwd URG Flags
  - Fwd RST Flags
  - Bwd RST Flags
  - Fwd Header Length
  - Bwd Header Length
  - Fwd Packets/s
  - Bwd Packets/s
  - Packet Length Min
  - Packet Length Max
  - Packet Length Mean
  - Packet Length Std
  - FIN Flag Count
  - SYN Flag Count
  - RST Flag Count
  - PSH Flag Count
  - ACK Flag Count
  - URG Flag Count
  - CWR Flag Count
  - ECE Flag Count
  - Down/Up Ratio
  - Fwd Bytes/Bulk Avg
  - Fwd Packet/Bulk Avg
  - Fwd Bulk Rate Avg
  - Bwd Bytes/Bulk Avg
  - Bwd Packet/Bulk Avg
  - Bwd Bulk Rate Avg
  - FWD Init Win Bytes
  - Bwd Init Win Bytes
  - Fwd Act Data Pkts
  - Fwd Seg Size Min
  - Active Mean
  - Active Std
  - Active Max
  - Active Min
  - Idle Mean
  - Idle Std
  - Idle Max
  - Idle Min
  - Total TCP Flow Time

cat_cols:
  - Dst Port  # the service a flow targets: as in DataBadSmells, a feature (and provenance)
  - Protocol

provenance:  # where each CSV row comes from: the source and the time are never features
  src_ip: Src IP
  src_port: Src Port
  dst_ip: Dst IP
  dst_port: Dst Port
  time: Timestamp
  time_format: "%Y-%m-%d %H:%M:%S%.f"


min_class_count: 50  # classes with fewer rows are dropped
max_class_rows: 10000000  # Benign has 42.2M distinct rows (45.7M in all): a 16 GB machine holds a uniform sample of
                          #   10M, the scale of cic_2018_broken; every attack class is under it and kept whole
top_n: 32  # most frequent values of a categorical column with their own one-hot slot; the others share one
seed: 42
output_dir: resources/processed/cic_2018
db_path: resources/processed/grace.db
