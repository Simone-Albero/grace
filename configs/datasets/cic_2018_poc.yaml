# cic_2018 sampled into one CSV to compare grace and DataBadSmells (experiments/poc/generate.py, seed 42): BENIGN
# 100k lines, every other class whole up to 10k but FTP-BruteForce - Attempted whole (nearly all copies), raw lines
# byte for byte. Counts per class and per file of the source in its .manifest.json. Not features, as in cic_2018:
# id, Flow ID, Src/Dst IP, Src Port, Timestamp, Attempted Category, ICMP Code/Type and the columns that repeat others.
name: cic_2018_poc
path: resources/raw_data/cic_2018_poc/cic_2018_poc.csv
label_col: Label

num_cols:
  - Flow Duration
  - Total Fwd Packet
  - Total Bwd packets
  - Total Length of Fwd Packet
  - Total Length of Bwd Packet
  - Fwd Packet Length Max
  - Fwd Packet Length Min
  - Fwd Packet Length Mean
  - Fwd Packet Length Std
  - Bwd Packet Length Max
  - Bwd Packet Length Min
  - Bwd Packet Length Mean
  - Bwd Packet Length Std
  - Flow Bytes/s
  - Flow Packets/s
  - Flow IAT Mean
  - Flow IAT Std
  - Flow IAT Max
  - Flow IAT Min
  - Fwd IAT Total
  - Fwd IAT Mean
  - Fwd IAT Std
  - Fwd IAT Max
  - Fwd IAT Min
  - Bwd IAT Total
  - Bwd IAT Mean
  - Bwd IAT Std
  - Bwd IAT Max
  - Bwd IAT Min
  - Fwd PSH Flags
  - Bwd PSH Flags
  - Fwd URG Flags
  - Bwd URG Flags
  - Fwd RST Flags
  - Bwd RST Flags
  - Fwd Header Length
  - Bwd Header Length
  - Fwd Packets/s
  - Bwd Packets/s
  - Packet Length Min
  - Packet Length Max
  - Packet Length Mean
  - Packet Length Std
  - FIN Flag Count
  - SYN Flag Count
  - RST Flag Count
  - PSH Flag Count
  - ACK Flag Count
  - URG Flag Count
  - CWR Flag Count
  - ECE Flag Count
  - Down/Up Ratio
  - Fwd Bytes/Bulk Avg
  - Fwd Packet/Bulk Avg
  - Fwd Bulk Rate Avg
  - Bwd Bytes/Bulk Avg
  - Bwd Packet/Bulk Avg
  - Bwd Bulk Rate Avg
  - FWD Init Win Bytes
  - Bwd Init Win Bytes
  - Fwd Act Data Pkts
  - Fwd Seg Size Min
  - Active Mean
  - Active Std
  - Active Max
  - Active Min
  - Idle Mean
  - Idle Std
  - Idle Max
  - Idle Min
  - Total TCP Flow Time

cat_cols:
  - Dst Port  # the service a flow targets: as in DataBadSmells, a feature (and provenance)
  - Protocol

provenance:  # where each CSV row comes from: the source and the time are never features
  src_ip: Src IP
  src_port: Src Port
  dst_ip: Dst IP
  dst_port: Dst Port
  time: Timestamp
  time_format: "%Y-%m-%d %H:%M:%S%.f"

scenario:  # what the documentation of CSE-CIC-IDS2018 says of its classes, in the clock of Timestamp
  benign: BENIGN
  # the ports DataBadSmells ignores (metadata/cic2018): background services, no attack's target
  background_ports: [0, 53, 67, 68, 111, 123, 161, 179, 389, 427, 520, 1723, 1900]

min_class_count: 50  # classes with fewer rows are dropped
top_n: 32  # most frequent values of a categorical column with their own one-hot slot; the others share one
seed: 42
output_dir: resources/processed/cic_2018_poc
db_path: resources/processed/grace.db
