name: covertype
path: resources/raw_data/covertype/covertype.csv
label_col: Cover_Type

num_cols:
  # Quantitative (10)
  - Elevation
  - Aspect
  - Slope
  - Horizontal_Distance_To_Hydrology
  - Vertical_Distance_To_Hydrology
  - Horizontal_Distance_To_Roadways
  - Hillshade_9am
  - Hillshade_Noon
  - Hillshade_3pm
  - Horizontal_Distance_To_Fire_Points
  # Wilderness Area (4 binary one-hot)
  - Wilderness_Area_1
  - Wilderness_Area_2
  - Wilderness_Area_3
  - Wilderness_Area_4
  # Soil Type (40 binary one-hot)
  - Soil_Type_1
  - Soil_Type_2
  - Soil_Type_3
  - Soil_Type_4
  - Soil_Type_5
  - Soil_Type_6
  - Soil_Type_7
  - Soil_Type_8
  - Soil_Type_9
  - Soil_Type_10
  - Soil_Type_11
  - Soil_Type_12
  - Soil_Type_13
  - Soil_Type_14
  - Soil_Type_15
  - Soil_Type_16
  - Soil_Type_17
  - Soil_Type_18
  - Soil_Type_19
  - Soil_Type_20
  - Soil_Type_21
  - Soil_Type_22
  - Soil_Type_23
  - Soil_Type_24
  - Soil_Type_25
  - Soil_Type_26
  - Soil_Type_27
  - Soil_Type_28
  - Soil_Type_29
  - Soil_Type_30
  - Soil_Type_31
  - Soil_Type_32
  - Soil_Type_33
  - Soil_Type_34
  - Soil_Type_35
  - Soil_Type_36
  - Soil_Type_37
  - Soil_Type_38
  - Soil_Type_39
  - Soil_Type_40

cat_cols: []

split:  # stratified by class, after dropping the rare classes and the constant columns
  train: 0.4
  val: 0.15  # the ATC threshold is fitted here; no classifier trains on it
  test: 0.45  # every failure rate is measured here

min_class_count: 100  # classes with fewer rows are dropped
max_per_class: 10000  # most train rows per class the classifier is fitted on (null = all); every split stays whole
top_n: 32  # most frequent values of a categorical column with their own code (space) and one-hot column (classifier)
hash_buckets: 64  # the other values are hashed into this many codes
seed: 42
output_dir: resources/processed/covertype
db_path: resources/processed/grace.db
