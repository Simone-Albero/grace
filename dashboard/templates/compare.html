{% extends "base.html" %}
{% set nav = "compare" %}
{% block title %}Compare{% endblock %}
{% block body %}
<h1>Compare</h1>
<p class="muted">Each seed counts at its latest run, and each execution once. Bars are the mean
  over seeds, whiskers the std.</p>
<form class="filters" hx-get="/compare/charts" hx-target="#charts" hx-trigger="load, change"
      autocomplete="off">
  {% for key in MAIN_KEYS %}
  <label>filter {{ key }}
    <select name="{{ key }}">
      <option value="">all</option>
      {% for value in options[key] %}<option>{{ value }}</option>{% endfor %}
    </select>
  </label>
  {% endfor %}
  <label>metric
    <select name="metric">
      {% for name in metrics %}
      <option value="{{ name }}"{% if name == "classify.accuracy" %} selected{% endif %}>{{ labels[name] }}</option>
      {% endfor %}
    </select>
  </label>
  <label>x
    <select name="x">
      {% for key in MAIN_KEYS %}<option{% if key == "classifier" %} selected{% endif %}>{{ key }}</option>{% endfor %}
    </select>
  </label>
  <label>color
    <select name="color">
      <option value="">none</option>
      {% for key in MAIN_KEYS %}<option>{{ key }}</option>{% endfor %}
    </select>
  </label>
  <label>predictor score
    <select name="score">{% for s in scores %}<option>{{ s }}</option>{% endfor %}</select>
  </label>
</form>
<div id="charts"></div>
{% endblock %}
