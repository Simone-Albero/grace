{% extends "base.html" %}
{% block title %}Run {{ run_id }} regions{% endblock %}
{% block body %}
<h1>Run <a href="/runs/{{ run_id }}">{{ run_id }}</a> regions</h1>
<form id="filters" hx-get="/runs/{{ run_id }}/regions" hx-target="#regions"
      hx-trigger="change" hx-include="#regions" hx-push-url="true">
  <label>class
    <select name="class_id">
      <option value="">all</option>
      {% for id, name in classes %}
      <option value="{{ id }}"{% if class_id == id | string %} selected{% endif %}>{{ name }}</option>
      {% endfor %}
    </select>
  </label>
  <label>scored (enough test rows)
    <select name="used">
      <option value="">all</option>
      <option value="1"{% if used == "1" %} selected{% endif %}>used</option>
      <option value="0"{% if used == "0" %} selected{% endif %}>not used</option>
    </select>
  </label>
  {% for axis, current in (("x", x), ("y", y)) %}
  <label>{{ axis }}
    <select name="{{ axis }}">
      {% for column in axes %}
      <option{% if column == current %} selected{% endif %}>{{ column }}</option>
      {% endfor %}
    </select>
  </label>
  {% endfor %}
</form>
<div id="regions">{% include "_regions.html" %}</div>
{% if has_partitions %}
<h2>Partitions</h2>
<form hx-get="/runs/{{ run_id }}/partitions" hx-target="#partitions"
      hx-trigger="load, change" autocomplete="off">
  <label>metric
    <select name="metric">
      {% for metric in partition_metrics %}
      <option{% if metric == "skill" %} selected{% endif %}>{{ metric }}</option>
      {% endfor %}
    </select>
  </label>
  <label>x
    <select name="x">
      {% for axis in partition_axes %}
      <option{% if axis == "n_groups" %} selected{% endif %}>{{ axis }}</option>
      {% endfor %}
    </select>
  </label>
</form>
<div id="partitions"></div>
{% endif %}
{% endblock %}
